<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - DC Connect</title>

    <link rel="stylesheet" href="../assets/css/style.css">
</head>

<body>

<header>
    <h1>DC Connect</h1>
</header>

<div class="login-container">

    <h2>Create Account</h2>
    <p>Register to join DC Connect</p>

    <form id="registerForm">

        <label>Full Name</label>
        <input type="text" id="fullname" placeholder="Enter your full name" required>

        <label>Mobile Number</label>
        <input type="tel" id="mobile" placeholder="Enter your mobile number" required>

        <label>Email Address</label>
        <input type="email" id="regEmail" placeholder="Enter your email" required>

        <label>Password</label>
        <input type="password" id="regPassword" placeholder="Create password" required>

        <label>Confirm Password</label>
        <input type="password" id="confirmPassword" placeholder="Confirm password" required>

        <div class="show-password">
            <input type="checkbox" id="showRegisterPassword">
            <label for="showRegisterPassword">Show Passwords</label>
        </div>

        <button type="submit">Create Account</button>

    </form>

    <p class="register-link">
        Already have an account?
        <a href="login.html">Login</a>
    </p>

    <p>
        <a href="../Index.html">⬅ Back to Home</a>
    </p>

</div>

<script src="../assets/js/script.js"></script>

</body>
</html>
